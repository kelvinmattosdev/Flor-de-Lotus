worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    etag on;
    keepalive_timeout 30;
    access_log off;

    # Diretorios gravaveis do runtime sem root; nao requer escrita em /var/cache.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Apenas JS/CSS gerados pelo Vite, com hash de 8 caracteres, sao immutable.
    # public/assets legado nao entra no contexto. Nomes estaveis sempre expiram.
    map $uri $static_cache_control {
        default "public, max-age=3600, must-revalidate";
        / "no-cache";
        ~*[.]html$ "no-cache";
        "~^/assets/[A-Za-z0-9_-]+-[A-Za-z0-9_-]{8}[.](js|css)$" "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html/site;
        index index.html;
        autoindex off;

        add_header Cache-Control $static_cache_control;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # Sinal para buscadores, NAO controle de acesso nem garantia de privacidade.
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        location ~ (^|/)[.] {
            return 404;
        }

        # MPA real: produto.html aceita query sem rewrite; ausentes retornam 404.
        # Sem fallback SPA para index.html; prepaint inline nao recebe CSP restritiva.
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
