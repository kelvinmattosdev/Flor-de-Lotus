<!doctype html>
<html lang="pt-BR" data-type="product" data-radius="soft" data-buttons="solid" data-motion data-motion-choice="auto" data-motion-effective="reduced">

  <meta name="page-type" content="product">

  <meta name="theme-color" content="#fbf7f0">

  <meta property="og:title" content="Produto · Flor de Lotus">

  <link rel="preload" href="/fonts/cormorant-roman.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin>
  <script>try{const r=document.documentElement,k=localStorage.getItem('flor-de-lotus:motion:v1'),c=['auto','full','reduced'].includes(k)?k:'auto';r.dataset.motionChoice=c;r.dataset.motionEffective=c==='full'||c==='auto'&&!matchMedia('(prefers-reduced-motion: reduce)').matches?'full':'reduced'}catch{document.documentElement.dataset.motionEffective=matchMedia('(prefers-reduced-motion: reduce)').matches?'reduced':'full'}</script>
  <link rel="stylesheet" href="/src/styles.css">
  <link rel="stylesheet" href="/src/motion.css">
</head>
<body data-page="product">

  </main>
  <div id="storefront-footer"></div>
  <div id="storefront-dialogs"></div>

</body>
